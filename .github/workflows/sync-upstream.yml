name: 同步上游

# 手动把 magpie-community/plugins 里 packages/agy-cli 的新提交合并进 main。
# 日常定时同步与自动解冲突由外部定时任务负责，这里仅保留手动触发以避免竞态。
# 合并无冲突且 bun test 通过才推送；否则不推送，开一个 sync-failed issue。
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拆出上游 packages/agy-cli 的历史
        run: |
          git clone --quiet https://github.com/magpie-community/plugins.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" subtree split --prefix=packages/agy-cli HEAD -b agy-cli > /dev/null
          git fetch --quiet "$RUNNER_TEMP/upstream" agy-cli:refs/remotes/upstream-split

      - name: 合并
        id: merge
        run: |
          if git merge-base --is-ancestor upstream-split HEAD; then
            echo "上游没有新提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          version=$(git show upstream-split:package.json | jq -r .version)
          if ! git merge --no-edit -m "同步上游 agy-cli $version" upstream-split; then
            echo "合并冲突的文件："
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.merge.outputs.changed == 'true'

      - name: 测试
        if: steps.merge.outputs.changed == 'true'
        run: bun test

      - name: 推送
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main upstream-split:refs/heads/upstream

      - name: 成功后关闭旧的失败 issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label sync-failed --json number -q '.[].number'); do
            gh issue close "$n" --comment "已同步成功：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: 失败时开 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --label sync-failed --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "又失败了一次：$run"
          else
            gh label create sync-failed --color d73a4a --description "上游同步失败" 2> /dev/null || true
            gh issue create --label sync-failed --title "上游同步失败，需要人工处理" \
              --body "合并冲突或测试未通过，main 没有更新。运行记录：$run"
          fi
